[package]
name = "hubbub-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hubbub"
path = "src/main.rs"

[dependencies]
hubbub-core = { path = "../core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "sync"] }
serde_json = "1.0.154"
