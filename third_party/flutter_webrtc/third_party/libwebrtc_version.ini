# libwebrtc prebuilt binary release info.
# See https://github.com/webrtc-sdk/libwebrtc/releases for available versions.
# `download_url` is the base release-download URL; the version tag, asset name
# and `.zip` suffix are appended at configure time by third_party/CMakeLists.txt.
#
# Keys prefixed `win_` override the plain keys on Windows. Hubbub's Windows
# build is our own (no 16 kHz AEC DMO, 48 kHz APM), hosted on a zip-only
# prerelease of sbenson2/hubbub; see third_party/libwebrtc-hubbub/README.md.
# `win_x64_sha256` / `win_arm64_sha256` (optional) are checked on every
# configure, for a fresh download and for a cached zip alike. Linux uses the
# upstream build with no hash.
[libwebrtc]
binary_version = libwebrtc.m150.7871.03
download_url   = https://github.com/webrtc-sdk/libwebrtc/releases/download
win_binary_version = libwebrtc.m150.7871.03-hubbub1
win_download_url   = https://github.com/sbenson2/hubbub/releases/download
win_x64_sha256     = 5392f31bf0afc11e676a56f293eb2b6fc76f54037607ee042f0bea4d42fcf1b7
