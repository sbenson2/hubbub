[package]
name = "hubbub-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
hkdf = "0.13.0"
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
iroh = "1.3.0"
hex = "0.4.3"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "io-util"] }
tempfile = { version = "3.27.0", optional = true }
getrandom = "0.4.3"
livekit-api = { version = "=0.9.0", default-features = false, features = ["access-token"] }
async-trait = "0.1.92"
igd-next = { version = "=0.18.0", features = ["aio_tokio"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
bytes = "1"
# The member-side TURN shim (media_tunnel). MIT/Apache-2.0, webrtc-rs.
turn = "=0.17.2"
webrtc-util = "=0.17.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
# Exposes net::test_support to other crates and tasks.
test-util = ["dep:tempfile"]

# Latest stable Tech Stack crates as of 2026-10-17 (crates.io). Added by the
# task that first uses each one; versions to use:
#   iroh 1.3.0, tokio 1.53.3, serde 1.0.229, serde_json 1.0.154,
#   igd-next 0.18.0, livekit-api 0.9.0, hkdf 0.13.0, sha2 0.11.1,
#   sysinfo 0.39.6, clap 4.6.7, anyhow 1.0.104

[dev-dependencies]
tempfile = "3.27.0"
base64 = "0.22.1"

# Both need Node::start_with_addrs and FakeHost; skipped without the feature.
[[test]]
name = "handover"
required-features = ["test-util"]

[[test]]
name = "text"
required-features = ["test-util"]

[[test]]
name = "membership"
required-features = ["test-util"]

[[test]]
name = "hub"
required-features = ["test-util"]

[[test]]
name = "join"
required-features = ["test-util"]

[[test]]
name = "media_relay"
required-features = ["test-util"]
